name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/tte_lab.py
      - run: python -m unittest discover -s tests -v
      - run: python -m src.run --output-dir results/ci --bootstrap 1000 --simulations 100
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-${{ matrix.os }}-${{ matrix.python }}
          path: results/ci/
          if-no-files-found: error

